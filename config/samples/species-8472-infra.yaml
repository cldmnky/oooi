apiVersion: hostedcluster.densityops.com/v1alpha1
kind: Infra
metadata:
  name: species-8472
  namespace: clusters
spec:
  networkConfig:
    cidr: 10.202.64.0/24
    gateway: 10.202.64.1
    networkAttachmentDefinition: vlan203
    networkAttachmentNamespace: default
    # The management cluster's resolvers can reach the lab DNS upstreams;
    # public DNS egress from the DNS pod is not required.
    dnsServers:
    - 10.201.0.2
    - 10.201.0.1
  infraComponents:
    dhcp:
      enabled: true
      image: quay.io/cldmnky/oooi:latest
      serverIP: 10.202.64.2
      rangeStart: 10.202.64.200
      rangeEnd: 10.202.64.254
      leaseTime: 1h
    dns:
      enabled: true
      image: quay.io/cldmnky/oooi:latest
      serverIP: 10.202.64.3
    proxy:
      enabled: true
      managerImage: quay.io/cldmnky/oooi:latest
      proxyImage: envoyproxy/envoy:v1.36.4
      serverIP: 10.202.64.4
      internalProxyService: species-8472-proxy.clusters.svc.cluster.local
---
apiVersion: hostedcluster.densityops.com/v1alpha1
kind: InfraClusterAttachment
metadata:
  name: species-8472
  namespace: clusters
spec:
  infraRef:
    name: species-8472
  hostedClusterRef:
    name: species-8472
    namespace: clusters
  dns:
    clusterName: species-8472
    baseDomain: clusters.blahonga.me
  # Expose this cluster's SNI proxy through the hosting cluster's MetalLB.
  # ExternalDNS publishes the OAuth hostname from this Service's assigned VIP.
  externalService:
    enabled: true
    addressPoolName: metallb-pool
    annotations:
      external-dns.alpha.kubernetes.io/hostname: oauth.species-8472.clusters.blahonga.me.
    labels:
      external-dns.blahonga.me/publish: "yes"
  appsIngress:
    enabled: true
    metallb:
      addressPoolName: vlan203-apps
      ipAddressPoolRange: 10.202.64.180-10.202.64.190
    service:
      name: oooi-ingress
      namespace: openshift-ingress
      annotations:
        external-dns.alpha.kubernetes.io/hostname: '*.apps.species-8472.clusters.blahonga.me.'
      labels:
        external-dns.blahonga.me/publish: "yes"
