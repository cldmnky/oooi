apiVersion: hostedcluster.densityops.com/v1alpha1
kind: Infra
metadata:
  labels:
    app.kubernetes.io/name: oooi
    app.kubernetes.io/managed-by: kustomize
  name: infra-sample
spec:
  networkConfig:
    cidr: "192.168.100.0/24"
    gateway: "192.168.100.1"
    networkAttachmentDefinition: "test-vlan-100"
    # Optional: Specify the namespace where the NetworkAttachmentDefinition resides
    # If not specified, defaults to the Infra CR's namespace
    networkAttachmentNamespace: "default"
    # Upstream DNS servers for CoreDNS to forward non-HCP queries to
    # These are NOT the DNS servers assigned to DHCP clients
    # When dns.enabled=true, DHCP clients get the CoreDNS server IP automatically
    # Use ["resolv.conf"] on networks without direct egress to public resolvers:
    # CoreDNS then forwards to the node's own nameservers.
    dnsServers:
      - "8.8.8.8"
      - "8.8.4.4"
  
  infraComponents:
    dhcp:
      enabled: true
      serverIP: "192.168.100.2"
      rangeStart: "192.168.100.10"
      rangeEnd: "192.168.100.250"
      leaseTime: "1h"
    
    dns:
      enabled: true  # When enabled, DHCP automatically uses dns.serverIP
      serverIP: "192.168.100.3"  # VMs get this as their DNS server via DHCP
      baseDomain: "example.com"
      clusterName: "mycluster"
    
    proxy:
      enabled: true
      serverIP: "192.168.100.4"
      proxyImage: "envoyproxy/envoy:v1.36.4"
      managerImage: "quay.io/cldmnky/oooi:latest"
      # Optional: internal proxy service so management-cluster pods resolve HCP
      # names to the in-cluster proxy (pod-network view) instead of public DNS.
      # Accepts a ClusterIP Service FQDN or IP; leave unset to hide HCP from pods.
      # internalProxyService: "infra-sample-proxy.hosted-clusters.svc.cluster.local"
  
  # Optional: automate the hosted cluster's *.apps ingress via MetalLB.
  # service.labels/service.annotations are merged onto the LoadBalancer Service
  # in the hosted cluster on every reconcile - use them to let ExternalDNS
  # (running inside the hosted cluster, >=1.3.0) publish the wildcard record:
  #
  # appsIngress:
  #   enabled: true
  #   hostedClusterRef:
  #     name: mycluster
  #     namespace: clusters
  #   metallb:
  #     addressPoolName: "lab-network"
  #     ipAddressPoolRange: "192.168.100.200-192.168.100.220"
  #   service:
  #     name: "oooi-ingress"
  #     namespace: "openshift-ingress"
  #     annotations:
  #       external-dns.alpha.kubernetes.io/hostname: "*.apps.mycluster.example.com."
  #     labels:
  #       external-dns.example.com/publish: "yes"
  #   ports:
  #     http: 80
  #     https: 443
