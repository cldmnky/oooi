---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: infras.hostedcluster.densityops.com
spec:
  group: hostedcluster.densityops.com
  names:
    kind: Infra
    listKind: InfraList
    plural: infras
    shortNames:
    - infra
    singular: infra
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Infra is the Schema for the infras API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InfraSpec defines the desired state of Infra.
            properties:
              infraComponents:
                description: |-
                  InfraComponents defines the configuration for infrastructure services
                  (DHCP, DNS, Proxy) that bridge the isolated VLAN to the control plane.
                properties:
                  dhcp:
                    description: DHCP configuration for dynamic IP assignment to tenant
                      VMs.
                    properties:
                      enabled:
                        default: true
                        description: Enabled determines whether the DHCP server should
                          be deployed.
                        type: boolean
                      image:
                        description: Image is the container image for the DHCP server.
                        type: string
                      leaseTime:
                        default: 1h
                        description: LeaseTime is the DHCP lease duration (e.g., "1h",
                          "24h").
                        type: string
                      rangeEnd:
                        description: RangeEnd is the end of the DHCP IP address pool.
                        type: string
                      rangeStart:
                        description: RangeStart is the beginning of the DHCP IP address
                          pool.
                        type: string
                      serverIP:
                        description: |-
                          ServerIP is the static IP address assigned to the DHCP server pod
                          on the secondary network. Must be within the NetworkConfig CIDR.
                        type: string
                    type: object
                  dns:
                    description: DNS configuration for split-horizon CoreDNS service.
                    properties:
                      enabled:
                        default: true
                        description: Enabled determines whether the DNS server should
                          be deployed.
                        type: boolean
                      image:
                        description: Image is the container image for CoreDNS.
                        type: string
                      serverIP:
                        description: |-
                          ServerIP is the static IP address assigned to the CoreDNS pod
                          on the secondary network. Must be within the NetworkConfig CIDR.
                        type: string
                    type: object
                  proxy:
                    description: Proxy configuration for Envoy L4 proxy gateway.
                    properties:
                      enabled:
                        default: true
                        description: Enabled determines whether the Envoy proxy should
                          be deployed.
                        type: boolean
                      internalProxyService:
                        description: |-
                          InternalProxyService is the internal proxy service for pod network access.
                          Can be a ClusterIP service name (e.g., "envoy-internal.namespace.svc.cluster.local")
                          or a ClusterIP address. Used by DNS default view for management cluster pod access.
                        type: string
                      managerImage:
                        default: quay.io/cldmnky/oooi:latest
                        description: ManagerImage is the container image for the xDS
                          control plane (oooi).
                        type: string
                      proxyImage:
                        default: envoyproxy/envoy:v1.36.4
                        description: ProxyImage is the container image for Envoy proxy.
                        type: string
                      serverIP:
                        description: |-
                          ServerIP is the static IP address assigned to the Envoy proxy pod
                          on the secondary network. Must be within the NetworkConfig CIDR.
                          This is used for external access (VM/multus network).
                        type: string
                    type: object
                type: object
              networkConfig:
                description: |-
                  NetworkConfig defines the secondary network (VLAN) configuration
                  for the hosted cluster's isolated network.
                properties:
                  attachment:
                    description: |-
                      Attachment references the network attachment resource (Multus
                      NetworkAttachmentDefinition or OVN-Kubernetes ClusterUserDefinedNetwork)
                      that represents this network. Structured form: when set, topology, role,
                      exposure and ipam must be specified and the legacy
                      networkAttachmentDefinition fields must be empty.
                    properties:
                      kind:
                        description: |-
                          Kind identifies the kind of the attachment resource. Supported values:
                          NetworkAttachmentDefinition, ClusterUserDefinedNetwork.
                        enum:
                        - NetworkAttachmentDefinition
                        - ClusterUserDefinedNetwork
                        type: string
                      name:
                        description: Name is the name of the attachment resource.
                        minLength: 1
                        type: string
                      namespace:
                        description: |-
                          Namespace is the namespace of the attachment resource. For
                          NetworkAttachmentDefinition it defaults to the Infra namespace when
                          empty. For the cluster-scoped ClusterUserDefinedNetwork kind it is
                          required: it identifies the namespace of the NADs and endpoints
                          generated for the CUDN.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  cidr:
                    description: |-
                      CIDR is the IP address range for the secondary network in CIDR notation.
                      Example: "192.168.100.0/24"
                    pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
                    type: string
                  dnsServers:
                    description: |-
                      DNSServers is an optional list of upstream DNS servers for external resolution.
                      If not specified, the infrastructure DNS will use the pod's default resolvers.
                    items:
                      type: string
                    type: array
                  exposure:
                    description: |-
                      Exposure defines how the network is exposed. Supported values: Layer2,
                      BGP.
                    enum:
                    - Layer2
                    - BGP
                    type: string
                  gateway:
                    description: |-
                      Gateway is the default gateway IP address for the network. Required for
                      Secondary networks with DHCP or External IPAM; optional for primary
                      OVN-Kubernetes networks.
                      Example: "192.168.100.1"
                    pattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$
                    type: string
                  ipam:
                    description: |-
                      IPAM defines the IP address management mode. Supported values: DHCP,
                      External, OVNKubernetes.
                    enum:
                    - DHCP
                    - External
                    - OVNKubernetes
                    type: string
                  networkAttachmentDefinition:
                    description: |-
                      NetworkAttachmentDefinition is the name of the Multus NetworkAttachmentDefinition
                      that represents the secondary VLAN. Legacy form: only used when the
                      structured attachment field is absent.
                    minLength: 1
                    type: string
                  networkAttachmentNamespace:
                    description: |-
                      NetworkAttachmentNamespace is the namespace where the NetworkAttachmentDefinition resides.
                      If not specified, the operator will look for the NAD first in the current namespace,
                      then in the default namespace.
                    type: string
                  role:
                    description: |-
                      Role defines whether this network is the primary or a secondary network.
                      Supported values: Secondary, Primary.
                    enum:
                    - Secondary
                    - Primary
                    type: string
                  routeAdvertisementsRef:
                    description: |-
                      RouteAdvertisementsRef references a cluster-scoped route advertisements
                      resource. Required for ClusterUserDefinedNetwork BGP exposure and
                      forbidden for Localnet topology. For a classic NetworkAttachmentDefinition
                      with BGP exposure it is optional validation/intent metadata.
                    properties:
                      name:
                        description: Name is the name of the cluster-scoped resource.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  topology:
                    description: |-
                      Topology defines the network topology. Supported values: Localnet,
                      Layer2, Layer3.
                    enum:
                    - Localnet
                    - Layer2
                    - Layer3
                    type: string
                required:
                - cidr
                type: object
                x-kubernetes-validations:
                - message: networkConfig must specify either attachment or networkAttachmentDefinition
                  rule: has(self.attachment) || has(self.networkAttachmentDefinition)
                - message: networkConfig cannot mix legacy networkAttachmentDefinition/networkAttachmentNamespace
                    with structured attachment/topology/role/exposure/ipam/routeAdvertisementsRef
                  rule: '!( (has(self.networkAttachmentDefinition) || has(self.networkAttachmentNamespace))
                    && (has(self.attachment) || has(self.topology) || has(self.role)
                    || has(self.exposure) || has(self.ipam) || has(self.routeAdvertisementsRef))
                    )'
                - message: networkConfig structured fields require attachment
                  rule: has(self.attachment) || (!has(self.topology) && !has(self.role)
                    && !has(self.exposure) && !has(self.ipam) && !has(self.routeAdvertisementsRef))
                - message: networkConfig networkAttachmentNamespace requires networkAttachmentDefinition
                  rule: '!has(self.networkAttachmentNamespace) || has(self.networkAttachmentDefinition)'
            required:
            - networkConfig
            type: object
          status:
            description: InfraStatus defines the observed state of Infra.
            properties:
              attachments:
                description: |-
                  Attachments summarizes the InfraClusterAttachment resources targeting
                  this Infra. Empty when none exist.
                properties:
                  ready:
                    description: Ready is the number of attachments whose Ready condition
                      is True.
                    format: int32
                    type: integer
                  total:
                    description: Total is the number of attachments targeting this
                      Infra.
                    format: int32
                    type: integer
                type: object
              componentStatus:
                description: ComponentStatus tracks the status of individual infrastructure
                  components.
                properties:
                  dhcpReady:
                    description: DHCPReady indicates whether the DHCP server is ready.
                    type: boolean
                  dnsReady:
                    description: DNSReady indicates whether the CoreDNS server is
                      ready.
                    type: boolean
                  proxyReady:
                    description: |-
                      ProxyReady indicates that a valid ProxyServer configuration was reconciled.
                      It does not indicate Deployment availability.
                    type: boolean
                type: object
              conditions:
                description: Conditions represents the latest available observations
                  of the Infra's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed Infra.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
