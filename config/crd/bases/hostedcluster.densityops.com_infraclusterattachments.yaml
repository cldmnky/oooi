---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: infraclusterattachments.hostedcluster.densityops.com
spec:
  group: hostedcluster.densityops.com
  names:
    kind: InfraClusterAttachment
    listKind: InfraClusterAttachmentList
    plural: infraclusterattachments
    shortNames:
    - infraattachment
    - ica
    singular: infraclusterattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Referenced Infra
      jsonPath: .spec.infraRef.name
      name: Infra
      type: string
    - description: Attached HostedCluster
      jsonPath: .spec.hostedClusterRef.name
      name: HostedCluster
      type: string
    - description: Hosted cluster domain
      jsonPath: .status.domain
      name: Domain
      type: string
    - description: Ready status
      jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InfraClusterAttachment attaches one HyperShift HostedCluster to the shared
          VLAN infrastructure owned by an Infra resource. Multiple attachments may
          reference the same Infra; each contributes its own DNS records, Envoy SNI
          backends, and optional apps-ingress automation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InfraClusterAttachmentSpec defines the desired state of InfraClusterAttachment.
            properties:
              apiServerService:
                description: |-
                  APIServerService is the name of the hosted API server Service in the
                  control plane namespace. Defaults to "kube-apiserver".
                type: string
              appsIngress:
                description: |-
                  AppsIngress configures optional per-cluster *.apps ingress automation.
                  MetalLB ranges must not overlap between attachments sharing a VLAN.
                properties:
                  baseDomain:
                    description: |-
                      BaseDomain is the base domain for the hosted cluster's apps ingress.
                      Example: "apps.example.com" where *.apps.<cluster>.apps.example.com will be routable.
                    type: string
                  enabled:
                    default: false
                    description: Enabled determines whether apps ingress automation
                      should be deployed.
                    type: boolean
                  hostedClusterRef:
                    description: HostedClusterRef references the HostedCluster for
                      which apps ingress is being configured.
                    properties:
                      name:
                        description: Name is the name of the HostedCluster.
                        type: string
                      namespace:
                        default: clusters
                        description: Namespace is the namespace of the HostedCluster.
                        type: string
                    required:
                    - name
                    type: object
                  metallb:
                    description: MetalLB contains configuration for the user-managed
                      MetalLB installation.
                    properties:
                      addressPoolName:
                        description: |-
                          AddressPoolName is the MetalLB address pool name to use for the LoadBalancer service.
                          Example: "lab-network"
                        type: string
                      ipAddressPoolRange:
                        description: |-
                          IPAddressPoolRange defines the valid range of IPs expected to be allocated by MetalLB.
                          Format: "start-end" or "start/prefix" notation.
                          This is for documentation/validation purposes only; not enforced by the operator.
                          Example: "10.202.64.221-10.202.64.240"
                        type: string
                      l2AdvertisementName:
                        description: L2AdvertisementName is the MetalLB L2Advertisement
                          resource name.
                        type: string
                    type: object
                  ports:
                    description: Ports defines the HTTP/HTTPS ports for the ingress.
                    properties:
                      http:
                        default: 80
                        description: HTTP port number.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      https:
                        default: 443
                        description: HTTPS port number.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                    type: object
                  service:
                    description: Service defines the LoadBalancer service to be created
                      in the hosted cluster.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations are merged into the LoadBalancer Service metadata.annotations
                          on every reconciliation. Existing annotations not listed here are
                          preserved (except the MetalLB pool annotation, which is managed by the
                          operator). Use this to publish the wildcard hostname via ExternalDNS, e.g.
                          "external-dns.alpha.kubernetes.io/hostname: *.apps.mycluster.example.com."
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels are merged into the LoadBalancer Service metadata.labels on every
                          reconciliation. Existing labels not listed here are preserved. Use this to
                          flag the Service for ExternalDNS running inside the hosted cluster, e.g.
                          "external-dns.example.com/publish: yes".
                        type: object
                      name:
                        default: oooi-ingress
                        description: Name is the name of the LoadBalancer service
                          in the hosted cluster.
                        type: string
                      namespace:
                        description: |-
                          Namespace is the namespace where the service will be created.
                          Default: "openshift-ingress"
                        type: string
                    type: object
                type: object
              controlPlaneNamespace:
                description: |-
                  ControlPlaneNamespace is the management-cluster namespace hosting this
                  cluster's control-plane Services. When empty, oooi derives it from the
                  HostedCluster reference as "<namespace>-<name>".
                type: string
              dns:
                description: |-
                  DNS defines the hosted cluster DNS naming used to generate static
                  records on the shared DNSServer and SNI routes on the shared ProxyServer.
                properties:
                  baseDomain:
                    description: |-
                      BaseDomain is the DNS base domain of the hosted cluster, for example
                      "clusters.example.com".
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                    type: string
                  clusterName:
                    description: |-
                      ClusterName is the hosted cluster name used to construct FQDNs such as
                      "api.<clusterName>.<baseDomain>".
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - baseDomain
                - clusterName
                type: object
              hostedClusterRef:
                description: |-
                  HostedClusterRef references the HyperShift HostedCluster attached to
                  the shared infrastructure. Each HostedCluster may be referenced by at
                  most one InfraClusterAttachment.
                properties:
                  name:
                    description: Name is the name of the HostedCluster.
                    type: string
                  namespace:
                    default: clusters
                    description: Namespace is the namespace of the HostedCluster.
                    type: string
                required:
                - name
                type: object
              infraRef:
                description: |-
                  InfraRef references the shared Infra resource that owns the VLAN
                  infrastructure (DHCP, DNS, and proxy). The InfraClusterAttachment must
                  be created in the same namespace as the referenced Infra.
                properties:
                  name:
                    description: Name is the name of the referenced Infra resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - dns
            - hostedClusterRef
            - infraRef
            type: object
          status:
            description: InfraClusterAttachmentStatus defines the observed state of
              InfraClusterAttachment.
            properties:
              appsIngressStatus:
                description: |-
                  AppsIngressStatus tracks the per-cluster apps ingress state in the
                  hosted cluster.
                properties:
                  externalHostname:
                    description: |-
                      ExternalHostname is the external hostname assigned to the hosted cluster's LoadBalancer service.
                      Only populated when the LoadBalancer reports a hostname instead of an IP address.
                    type: string
                  externalIP:
                    description: |-
                      ExternalIP is the external IP assigned by MetalLB to the hosted cluster's LoadBalancer service.
                      Only populated when the LoadBalancer reports an IP address.
                    type: string
                  lastSyncTime:
                    description: LastSyncTime is the timestamp of the last successful
                      reconciliation.
                    format: date-time
                    type: string
                  message:
                    description: Message provides a human-readable message explaining
                      the current status.
                    type: string
                  phase:
                    description: |-
                      Phase represents the current phase of apps ingress provisioning.
                      Possible values: Pending, Ready, Degraded
                    type: string
                  reason:
                    description: Reason provides a short reason for the current phase.
                    type: string
                type: object
              conditions:
                description: |-
                  Conditions represents the latest available observations of the
                  InfraClusterAttachment's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controlPlaneNamespace:
                description: |-
                  ControlPlaneNamespace is the resolved management-cluster namespace
                  hosting this cluster's control-plane Services.
                type: string
              domain:
                description: |-
                  Domain is the fully qualified hosted cluster domain derived from
                  spec.dns ("<clusterName>.<baseDomain>").
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration reflects the generation of the most recently
                  observed InfraClusterAttachment.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
