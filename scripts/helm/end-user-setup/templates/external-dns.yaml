{{- if .Values.externalDNS.enabled }}
{{- range .Values.attachments }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}-external-dns
  namespace: {{ $.Values.externalDNS.namespace }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}-external-dns
  namespace: {{ $.Values.externalDNS.namespace }}
  labels:
    app.kubernetes.io/name: external-dns
    app.kubernetes.io/instance: {{ .name }}-external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
      app.kubernetes.io/instance: {{ .name }}-external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
        app.kubernetes.io/instance: {{ .name }}-external-dns
    spec:
      serviceAccountName: {{ .name }}-external-dns
      containers:
        - name: external-dns
          image: {{ $.Values.externalDNS.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --kubeconfig=/etc/kubeconfig/config
            - --provider=aws
            - --source=service
            - --policy=sync
            - --registry=txt
            - --txt-owner-id={{ .name }}-external-dns
            - --txt-prefix=external-dns-
            - --zone-id-filter={{ $.Values.externalDNS.zoneID }}
            - --label-filter=external-dns.blahonga.me/publish=yes
            - --service-type-filter=LoadBalancer
            - --metrics-address=127.0.0.1:7979
            - --log-level=info
          env:
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /etc/kubernetes/aws-credentials
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubeconfig
              readOnly: true
            - name: aws-credentials
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ .name }}-external-dns-kubeconfig
        - name: aws-credentials
          secret:
            secretName: {{ .name }}-external-dns-credentials
            items:
              - key: credentials
                path: aws-credentials
---
{{- end }}
{{- end }}
